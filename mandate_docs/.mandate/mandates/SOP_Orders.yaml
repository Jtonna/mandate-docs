# SOP_Orders
#
# A mandate is self-contained. It declares its own linkage, so the whole system
# can be rebuilt by parsing every file in .mandate/mandates/.
#
# .mandate/mandate.json is a serialised copy of that same data, kept for fast
# rebuilds. This file is the source of truth; mandate.json is derived from it.

name: SOP_Orders

# Human-facing only. Says what this mandate is meant to cover, for whoever opens
# the file. It is not passed to agents when rules run, so it cannot influence a
# result. Optional, and entirely up to the author how or whether to use it.
description: >
  Covers the order placement path: the domain transition rules and the HTTP
  surface that exposes them. Does not cover fulfilment, cancellation, or
  payment.

# Rules are defined once and referenced by id from the documents they apply to.
# At least one rule is required.
#
# Nothing executes rules yet. The run commands and prompts below are
# illustrative: no scripts/ folder exists, and the argument style shown is an
# example rather than a convention the format defines.
#
#   type: script  - runs a command. Deterministic. Exit 0 passes.
#   type: agent   - runs a prompt against an AI agent. A judgement, and may
#                   vary between runs.
#
# A rule's description is human-facing, like the mandate's. Only prompt is sent
# to the agent, so editing a description can never change a result.
rules:
  - id: has-owner
    type: script
    description: The document names an owner.
    run: ./scripts/mandate/check-owner.sh

  - id: sections-present
    type: script
    description: >
      The document has the sections an SOP requires. Fails on a document that
      does not exist yet.
    run: ./scripts/mandate/check-sections.sh --require Purpose,Scope,Owner,Steps

  - id: claims-match-code
    type: agent
    description: Documented behaviour matches what the code actually does.
    prompt: >
      Read the document and the source files linked to it. For every factual
      claim the document makes about behaviour, check it against the code.
      Report each claim the code contradicts, quoting the document line and the
      source file and line that disagrees with it. Do not report stylistic
      differences or missing detail, only contradictions.

  - id: endpoints-exist
    type: agent
    description: Every HTTP endpoint the document names exists in code.
    prompt: >
      List every HTTP method and path named in the document. For each, confirm
      a matching route exists in the linked source files. Report any endpoint
      that is documented but absent from the code, and any route present in the
      code but absent from the document.

# The documents this mandate governs, and which rules apply to each.
# Paths are relative to the repository root. Markdown files in this repository
# only; external documentation is not supported.
governs:
  - doc: docs/architecture/order-lifecycle.md
    rules:
      - has-owner
      - sections-present
      - claims-match-code

  - doc: docs/architecture/http-api.md
    rules:
      - claims-match-code
      - endpoints-exist

# The source files, and which of the documents above each one links to.
# This is what a rule reads when it needs to check a document against code.
code:
  - path: src/domain/order.ts
    docs:
      - docs/architecture/order-lifecycle.md

  - path: src/application/place-order.ts
    docs:
      - docs/architecture/order-lifecycle.md

  - path: src/adapters/http/order-controller.ts
    docs:
      - docs/architecture/order-lifecycle.md
      - docs/architecture/http-api.md
